name: Build ReSukiSU Kernel

on:
  workflow_dispatch:
  schedule:
    # 每周日 04:00 UTC 检测上游更新
    - cron: '0 4 * * 0'

env:
  KERNEL_BRANCH: lineage-21-ksu
  KERNEL_REPO: Coconutat/android_kernel_xiaomi_sdm845_lineageos_Exp
  RESUKISU_REPO: ReSukiSU/ReSukiSU
  DEVICE: equuleus

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check upstream updates
        id: check
        run: |
          NEW_SHA=$(git ls-remote https://github.com/${{ env.RESUKISU_REPO }}.git HEAD | awk '{print $1}')
          echo "new_sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
          SKIP=false
          if gh release view latest --repo ${{ github.repository }} >/dev/null 2>&1; then
            OLD_SHA=$(gh release view latest --repo ${{ github.repository }} --json body -q .body | grep -oP 'ReSukiSU: \K[0-9a-f]{7}' | head -1 || true)
            if [ -n "$OLD_SHA" ] && [ "$OLD_SHA" = "${NEW_SHA:0:7}" ]; then
              SKIP=true
              echo "上游无更新，跳过构建"
            fi
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "sha7=${NEW_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y mkbootimg git cpio lz4

      - name: Download toolchain
        if: steps.check.outputs.skip != 'true'
        run: |
          git clone --depth=1 https://github.com/PixelExperience/prebuilts_clang_kernel_linux-x86_clang-r416183b.git clang
          git clone --depth=1 https://github.com/PixelExperience/prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc-aarch64
          git clone --depth=1 https://github.com/PixelExperience/prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc-arm

      - name: Clone kernel source
        if: steps.check.outputs.skip != 'true'
        run: git clone --depth=1 --branch ${{ env.KERNEL_BRANCH }} https://github.com/${{ env.KERNEL_REPO }}.git kernel

      - name: Clone ReSukiSU
        if: steps.check.outputs.skip != 'true'
        run: git clone --depth=1 https://github.com/${{ env.RESUKISU_REPO }}.git resukisu

      - name: Apply patches and integrate
        if: steps.check.outputs.skip != 'true'
        run: |
          cd kernel
          git apply ../patches/*.patch
          ln -s $PWD/../resukisu/kernel drivers/kernelsu
          cat arch/arm64/configs/vendor/xiaomi/mi845_defconfig > arch/arm64/configs/vendor/xiaomi/${{ env.DEVICE }}_defconfig
          cat arch/arm64/configs/vendor/xiaomi/${{ env.DEVICE }}.config >> arch/arm64/configs/vendor/xiaomi/${{ env.DEVICE }}_defconfig
          cat >> arch/arm64/configs/vendor/xiaomi/${{ env.DEVICE }}_defconfig << 'EOF'
          # ReSukiSU + SUSFS
          CONFIG_KSU=y
          CONFIG_KSU_MANUAL_HOOK=y
          # CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK is not set
          # CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK is not set
          # CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK is not set
          CONFIG_KSU_SUSFS=y
          CONFIG_SUSFS=y
          EOF

      - name: Build kernel
        if: steps.check.outputs.skip != 'true'
        run: |
          cd kernel
          export PATH=$PWD/../clang/bin:$PATH
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=$PWD/../gcc-aarch64/bin/aarch64-linux-android-
          export CROSS_COMPILE_ARM32=$PWD/../gcc-arm/bin/arm-linux-androideabi-
          export LLVM=1 LLVM_IAS=1
          export AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          make O=out ARCH=arm64 vendor/xiaomi/${{ env.DEVICE }}_defconfig CC=clang
          make -j$(nproc) O=out ARCH=arm64 CC=clang
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Package AnyKernel3 zip
        if: steps.check.outputs.skip != 'true'
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel3
          rm -rf anykernel3/.git
          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel3/Image.gz-dtb
          sed -i 's/device.name1=.*/device.name1=equuleus/' anykernel3/anykernel.sh
          sed -i 's/supported.versions=.*/supported.versions=13 - 15/' anykernel3/anykernel.sh
          cd anykernel3
          zip -r9 ../ReSukiSU-${{ env.DEVICE }}-AnyKernel3.zip . -x '*.git*' >/dev/null

      - name: Repack boot.img from stock
        if: steps.check.outputs.skip != 'true'
        run: |
          JSON=$(curl -sL "https://download.lineageos.org/api/v1/devices/${{ env.DEVICE }}/builds?limit=1")
          BOOT_URL=$(echo "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print([f['url'] for f in d[0]['files'] if f.get('filename')=='boot.img'][0])" 2>/dev/null || true)
          if [ -n "$BOOT_URL" ]; then
            curl -sL -o stock-boot.img "$BOOT_URL"
            mkdir -p boot-work
            unpack_bootimg --boot_img stock-boot.img --out boot-work/stock --format mkbootimg 2>&1 | grep -vE '^$' > boot-work/args.txt
            ARGS=$(grep -E '^--' boot-work/args.txt | tr '\n' ' ' | sed 's/--kernel [^ ]*//; s/--output [^ ]*//; s/  */ /g')
            mkbootimg --kernel kernel/out/arch/arm64/boot/Image.gz-dtb --ramdisk boot-work/stock/ramdisk --output boot-${{ env.DEVICE }}-resukisu.img $ARGS
          fi

      - name: Create Release
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-${{ steps.check.outputs.sha7 }}-${{ github.run_number }}
          name: ReSukiSU Kernel ${{ steps.check.outputs.sha7 }} (${{ env.DEVICE }})
          body: |
            ## 自动构建产物
            - 内核基座: ${{ env.KERNEL_REPO }} @ ${{ env.KERNEL_BRANCH }}
            - ReSukiSU: ${{ steps.check.outputs.sha7 }}
            - SUSFS: v2.1.0
            - 设备: ${{ env.DEVICE }} (Xiaomi Mi 8 Pro)
            - 刷入: `fastboot flash boot boot.img` 或 TWRP 刷 AnyKernel3 zip
          files: |
            ReSukiSU-${{ env.DEVICE }}-AnyKernel3.zip
            boot-${{ env.DEVICE }}-resukisu.img
          fail_on_unmatched_files: false
