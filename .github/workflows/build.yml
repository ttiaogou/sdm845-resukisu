name: Build ReSukiSU Kernel (LineageOS 20 / equuleus)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KERNEL_BRANCH: lineage-20
      KERNEL_REPO: LineageOS/android_kernel_xiaomi_sdm845
      RESUKISU_REPO: ReSukiSU/ReSukiSU
      DEVICE: equuleus

    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio device-tree-compiler flex git libelf-dev libssl-dev lz4 python3 zip unzip

      - name: Download toolchain
        run: |
          git clone --depth=1 https://github.com/PixelExperience/prebuilts_clang_kernel_linux-x86_clang-r416183b.git clang
          git clone --depth=1 https://github.com/PixelExperience/prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc-aarch64
          git clone --depth=1 https://github.com/PixelExperience/prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9.git gcc-arm

      - name: Clone official LineageOS 20 kernel
        run: |
          git clone --depth=1 --single-branch --branch "$KERNEL_BRANCH" "https://github.com/$KERNEL_REPO.git" kernel
          cd kernel
          grep -q '^VERSION = 4' Makefile
          grep -q '^PATCHLEVEL = 9' Makefile
          test -s arch/arm64/configs/vendor/xiaomi/mi845_defconfig
          test -s arch/arm64/configs/vendor/xiaomi/equuleus.config
          echo "Kernel source commit: $(git rev-parse HEAD)"
          make -s kernelversion

      - name: Clone ReSukiSU
        run: |
          git clone --depth=1 "https://github.com/$RESUKISU_REPO.git" resukisu
          echo "ReSukiSU source commit: $(git -C resukisu rev-parse HEAD)"

      - name: Apply existing ReSukiSU/SUSFS patch
        run: |
          test -s patches/0001-resukisu-susfs-sdm845.patch
          cd kernel
          # Fail clearly if the existing project patch does not match the official LOS20 tree.
          git apply --check ../patches/0001-resukisu-susfs-sdm845.patch
          git apply ../patches/0001-resukisu-susfs-sdm845.patch
          test ! -e drivers/kernelsu
          ln -s "$GITHUB_WORKSPACE/resukisu/kernel" drivers/kernelsu

      - name: Generate equuleus defconfig
        run: |
          cd kernel
          cat arch/arm64/configs/vendor/xiaomi/mi845_defconfig > arch/arm64/configs/vendor/xiaomi/${DEVICE}_defconfig
          cat arch/arm64/configs/vendor/xiaomi/${DEVICE}.config >> arch/arm64/configs/vendor/xiaomi/${DEVICE}_defconfig
          cat >> arch/arm64/configs/vendor/xiaomi/${DEVICE}_defconfig <<'EOF'
          # ReSukiSU + SUSFS (retain current project configuration)
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          EOF

      - name: Configure and verify KSU/SUSFS
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc-aarch64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/gcc-arm/bin/arm-linux-androideabi-"
          export LLVM=1 LLVM_IAS=1
          export AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip

          make O=out ARCH=arm64 vendor/xiaomi/${DEVICE}_defconfig CC=clang
          grep -qx 'CONFIG_KSU=y' out/.config
          grep -qx 'CONFIG_KSU_SUSFS=y' out/.config
          if grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' out/.config; then
            echo "ERROR: KSU_MANUAL_HOOK conflicts with this project's KSU_SUSFS configuration."
            exit 1
          fi
          grep -E '^(CONFIG_KSU|CONFIG_KSU_SUSFS|CONFIG_SUSFS)' out/.config || true

      - name: Build kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE="$GITHUB_WORKSPACE/gcc-aarch64/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/gcc-arm/bin/arm-linux-androideabi-"
          export LLVM=1 LLVM_IAS=1
          export AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang
          test -s out/arch/arm64/boot/Image.gz-dtb
          ls -lh out/arch/arm64/boot/Image.gz-dtb

      - name: Package equuleus AnyKernel3 ZIP (unchanged flash format)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git anykernel3
          rm -rf anykernel3/.git
          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel3/Image.gz-dtb

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("anykernel3/anykernel.sh")
          s = p.read_text(encoding="utf-8")

          def replace_exactly_one(pattern, replacement, label):
              global s
              matches = list(re.finditer(pattern, s, flags=re.MULTILINE))
              if len(matches) != 1:
                  raise SystemExit(f"ERROR: expected exactly one {label}, found {len(matches)}")
              s = re.sub(pattern, replacement, s, count=1, flags=re.MULTILINE)

          replace_exactly_one(r"^device\.name1=.*$", "device.name1=equuleus", "device.name1")
          for idx in range(2, 6):
              pattern = rf"^device\.name{idx}=.*$"
              if re.search(pattern, s, flags=re.MULTILINE):
                  s = re.sub(pattern, f"device.name{idx}=", s, count=1, flags=re.MULTILINE)

          if re.search(r"(?m)^supported\.versions=.*$", s):
              s = re.sub(r"(?m)^supported\.versions=.*$", "supported.versions=13", s, count=1)
          else:
              raise SystemExit("ERROR: supported.versions property not found")

          if not re.search(r"(?m)^BLOCK=.*;$", s):
              raise SystemExit("ERROR: BLOCK property not found; refusing to guess partition path")
          s = re.sub(r"(?m)^BLOCK=.*;$", "BLOCK=auto;", s, count=1)

          start = s.find("# init.tuna.rc")
          if start != -1:
              end = s.find("write_boot;", start)
              if end == -1:
                  raise SystemExit("ERROR: tuna template section has no write_boot boundary")
              s = s[:start] + s[end:]

          forbidden = ("toro", "toroplus", "tuna", "omap/omap_hsmmc", "init.tuna.rc", "fstab.tuna")
          leftovers = [item for item in forbidden if item.lower() in s.lower()]
          if leftovers:
              raise SystemExit("ERROR: unrelated AnyKernel3 template residue: " + ", ".join(leftovers))
          if "device.name1=equuleus" not in s or "BLOCK=auto;" not in s or "write_boot;" not in s:
              raise SystemExit("ERROR: AnyKernel3 device/partition/install validation failed")

          p.write_text(s, encoding="utf-8")
          print("Validated AnyKernel3 script for equuleus / Android 13")
          PY

          (cd anykernel3 && zip -qr9 "$GITHUB_WORKSPACE/ReSukiSU-equuleus-AnyKernel3.zip" . -x '*.git*')
          unzip -t ReSukiSU-equuleus-AnyKernel3.zip
          unzip -p ReSukiSU-equuleus-AnyKernel3.zip anykernel.sh | grep -E 'device.name1=|supported.versions=|^BLOCK='
          if unzip -p ReSukiSU-equuleus-AnyKernel3.zip anykernel.sh | grep -Eiq 'toro|toroplus|tuna|omap/omap_hsmmc|init.tuna.rc|fstab.tuna'; then
            echo "ERROR: unrelated AnyKernel3 template residue found in ZIP"
            exit 1
          fi
          sha256sum ReSukiSU-equuleus-AnyKernel3.zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReSukiSU-equuleus-Android13-AnyKernel3
          path: ReSukiSU-equuleus-AnyKernel3.zip
          if-no-files-found: error
          retention-days: 14
